<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#103c6e"><meta name="robots" content="noindex"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="apple-touch-icon.png"><title>Sign in — Voice to Report</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#eef3f8;color:#10233c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;padding:16px}
.box{width:100%;max-width:420px;background:#fff;border:1px solid #d9e2ec;border-radius:18px;padding:18px;box-shadow:0 7px 22px #103c6e15}
.head{background:linear-gradient(135deg,#103c6e,#1a528e);color:#fff;border-radius:14px;padding:18px}
.tag{display:inline-block;background:#f5c518;color:#103c6e;font-weight:800;font-size:13px;padding:3px 8px;border-radius:6px}
.head h1{margin:12px 0 6px;font-size:26px}.head p{margin:0;color:#dbe8f6;font-size:14px}
label{display:block;font-weight:700;margin:16px 0 6px}input{width:100%;font:inherit;padding:12px;border:1px solid #bdcad8;border-radius:12px}
button{width:100%;margin-top:18px;font:inherit;font-weight:700;border:0;border-radius:12px;padding:13px;background:#103c6e;color:#fff}button:disabled{opacity:.6}
#msg{min-height:20px;margin:12px 0 0;color:#b3261e;font-weight:600;text-align:center}.foot{margin:10px 0 0;text-align:center;color:#607086;font-size:14px}
</style></head><body><form class="box" id="f" autocomplete="on"><div class="head"><span class="tag">VTR</span><h1>Voice to Report</h1><p>Wilkinson Data &amp; Ops</p></div>
<label for="u">Username</label><input id="u" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
<label for="p">Password</label><input id="p" name="password" type="password" autocomplete="current-password" required>
<button id="b" type="submit">Sign in</button><p id="msg" role="alert"></p><p class="foot">Private system. Authorised access only.</p></form>
<script>
const f=document.getElementById('f'),b=document.getElementById('b'),msg=document.getElementById('msg');
f.onsubmit=async e=>{
  e.preventDefault();msg.textContent='';b.disabled=true;b.textContent='Signing in…';
  const u=document.getElementById('u').value.trim(),p=document.getElementById('p').value;
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({username:u,password:p})});
    const d=await r.json().catch(()=>({}));
    if(r.ok){try{localStorage.setItem('vtr_user',d.user||u.toLowerCase());localStorage.removeItem('vtr_code')}catch(x){}location.replace('/');return}
    msg.textContent=r.status===401?'Username or password not recognised.':r.status===429?'Too many attempts. Try again in 15 minutes.':r.status===503?'Sign-in is not set up yet.':'Sign-in failed. Please try again.';
  }catch(x){msg.textContent='No connection. Please try again.'}
  b.disabled=false;b.textContent='Sign in';
};
</script></body></html>
